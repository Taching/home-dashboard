name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  check:
    name: Verification (make check)
    runs-on: ubuntu-latest

    env:
      # Use an in-memory SQLite database for tests. This avoids needing
      # /data/chili.db and lets tests that call initialise_database() work.
      DATABASE_URL: "sqlite://"
      # Disable hardware features that would fail without Pi hardware.
      SENSOR_ENABLED: "false"
      # Provide sane defaults so settings.py can load without a .env file.
      TZ: "Asia/Tokyo"
      # Ensure dry-run mode (default, but explicit for CI)
      CHILI_PRODUCTION_MODE: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd backend && pip install -e .
          cd ../frontend && npm ci

      - name: Run verification
        run: make check
