name: chili-dashboard

services:
  backend:
    build:
      context: ./backend
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/chili.db
    volumes:
      - ./data:/data
    devices:
      - /dev/snd:/dev/snd
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_started
    ports:
      # Keep v1 local to the Pi. Phone access is added only with authentication.
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:8080:80"
    restart: unless-stopped

  walkingpad-collector:
    build:
      context: ./walkingpad-collector
    env_file: .env
    environment:
      DASHBOARD_URL: http://127.0.0.1:8080
    depends_on:
      backend:
        condition: service_started
    profiles: [walkingpad]
    restart: unless-stopped
